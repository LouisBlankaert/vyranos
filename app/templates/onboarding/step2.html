{% extends 'onboarding/layout.html' %}
{% block onboarding_content %}
<h2 class="text-2xl font-bold mb-1">Photos & identité</h2>
<p class="text-gray-500 text-sm mb-6">Étape 2 sur 5 — Visuels de votre page</p>

<form method="POST" enctype="multipart/form-data" class="space-y-5">
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1.5">Logo</label>
    {% if business.logo_url %}
    <img src="{{ business.logo_url }}" class="w-16 h-16 rounded-xl object-cover mb-2">
    {% endif %}
    <input type="file" name="logo" accept="image/png,image/jpeg,image/webp"
      class="text-sm text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 file:font-medium file:text-sm hover:file:bg-indigo-100">
    <p class="text-xs text-gray-400 mt-1">PNG, JPG ou WebP · Max 5 Mo</p>
  </div>
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1.5">Photo de couverture</label>
    {% if business.cover_url %}
    <img src="{{ business.cover_url }}" class="w-full h-32 rounded-xl object-cover mb-2">
    {% endif %}
    <input type="file" name="cover" accept="image/png,image/jpeg,image/webp"
      class="text-sm text-gray-600 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 file:font-medium file:text-sm hover:file:bg-indigo-100">
  </div>
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1.5">Couleur principale</label>
    <div class="flex items-center gap-4">
      <input type="color" name="couleur_primaire" value="{{ business.couleur_primaire }}"
        class="h-10 w-20 rounded-lg border border-gray-200 cursor-pointer">
      <span class="text-sm text-gray-500">Utilisée pour les boutons et accents</span>
    </div>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Instagram</label>
      <input type="text" name="instagram" value="{{ business.instagram or '' }}" placeholder="@votre_compte"
        class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">TikTok</label>
      <input type="text" name="tiktok" value="{{ business.tiktok or '' }}" placeholder="@votre_compte"
        class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
    </div>
  </div>
  <div class="flex justify-between pt-2">
    <a href="{{ url_for('onboarding.step1') }}" class="text-sm text-gray-500 hover:text-gray-700 px-5 py-3 rounded-lg border border-gray-200 hover:border-gray-300 transition">
      ← Retour
    </a>
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-lg text-sm transition">
      Suivant →
    </button>
  </div>
</form>
{% endblock %}
