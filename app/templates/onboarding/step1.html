{% extends 'onboarding/layout.html' %}
{% block onboarding_content %}
<h2 class="text-2xl font-bold mb-1">Votre commerce</h2>
<p class="text-gray-500 text-sm mb-6">Étape 1 sur 5 — Informations générales</p>

<form method="POST" class="space-y-4">
  <div class="grid grid-cols-2 gap-4">
    <div class="col-span-2">
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Nom du commerce *</label>
      <input type="text" name="nom" value="{{ business.nom }}" required
        class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
    </div>
    <div class="col-span-2">
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Description <span class="text-gray-400 font-normal">— visible sur votre page</span></label>
      <textarea name="description" rows="3" placeholder="Décrivez votre activité en quelques mots..."
        class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition resize-none">{{ business.description or '' }}</textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Adresse</label>
      <input type="text" name="adresse" value="{{ business.adresse or '' }}" placeholder="12 rue de la Paix"
        class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Ville</label>
      <input type="text" name="ville" value="{{ business.ville or '' }}" placeholder="Paris"
        class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Téléphone</label>
      <input type="tel" name="telephone" value="{{ business.telephone or '' }}" placeholder="06 12 34 56 78"
        class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Email de contact</label>
      <input type="email" name="email_contact" value="{{ business.email_contact or '' }}"
        class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
    </div>
  </div>
  <div class="flex justify-end pt-2">
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-lg text-sm transition">
      Suivant →
    </button>
  </div>
</form>
{% endblock %}
