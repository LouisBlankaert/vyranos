{% extends 'base.html' %}
{% block title %}Connexion — Vyranos{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 py-12 bg-gray-50">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="text-2xl font-bold">Local<span class="text-indigo-600">Site</span></a>
      <h1 class="mt-4 text-2xl font-bold text-gray-900">Connexion</h1>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form method="POST" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" name="email" required autofocus placeholder="vous@exemple.fr"
            class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe</label>
          <input type="password" name="password" required placeholder="••••••••"
            class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" name="remember" id="remember" class="rounded text-indigo-600">
          <label for="remember" class="text-sm text-gray-600">Se souvenir de moi</label>
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition text-sm">
          Se connecter
        </button>
      </form>
    </div>

    <p class="text-center mt-6 text-sm text-gray-500">
      Pas encore de compte ?
      <a href="/signup" class="text-indigo-600 hover:underline font-medium">Créer un compte</a>
    </p>
  </div>
</div>
{% endblock %}
