{% extends 'base.html' %}
{% block title %}Créer un compte — Vyranos{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 py-12 bg-gray-50">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="text-2xl font-bold">Local<span class="text-indigo-600">Site</span></a>
      <h1 class="mt-4 text-2xl font-bold text-gray-900">Créez votre compte</h1>
      <p class="mt-2 text-sm text-gray-500">7 jours gratuits, puis 30€/mois</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form method="POST" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Nom de votre commerce</label>
          <input type="text" name="nom_commerce" required placeholder="Ex: Salon Élise"
            class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" name="email" required placeholder="vous@exemple.fr"
            class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe <span class="text-gray-400 font-normal">(min. 8 caractères)</span></label>
          <input type="password" name="password" required minlength="8" placeholder="••••••••"
            class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition text-sm">
          Créer mon compte gratuitement →
        </button>
      </form>
    </div>

    <p class="text-center mt-6 text-sm text-gray-500">
      Déjà un compte ?
      <a href="/login" class="text-indigo-600 hover:underline font-medium">Se connecter</a>
    </p>
  </div>
</div>
{% endblock %}
