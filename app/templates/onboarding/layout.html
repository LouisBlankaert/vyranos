{% extends 'base.html' %}
{% block body %}
<div class="min-h-screen bg-gray-50">
  <nav class="bg-white border-b border-gray-100 px-6 h-16 flex items-center justify-between">
    <span class="text-lg font-bold">Local<span class="text-indigo-600">Site</span></span>
    <a href="{{ url_for('auth.logout') }}" class="text-sm text-gray-500 hover:text-gray-700">Déconnexion</a>
  </nav>

  <!-- PROGRESS -->
  <div class="max-w-2xl mx-auto px-4 pt-8">
    <div class="flex items-center gap-2 mb-8">
      {% for i in range(1, 6) %}
        <div class="flex items-center {% if not loop.last %}flex-1{% endif %}">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0
            {{ 'bg-indigo-600 text-white' if i == step else ('bg-indigo-100 text-indigo-400' if i < step else 'bg-gray-100 text-gray-400') }}">
            {{ '✓' if i < step else i }}
          </div>
          {% if not loop.last %}
          <div class="flex-1 h-0.5 mx-1 {{ 'bg-indigo-300' if i < step else 'bg-gray-200' }}"></div>
          {% endif %}
        </div>
      {% endfor %}
    </div>
  </div>

  <div class="max-w-2xl mx-auto px-4 pb-16">
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8">
      {% block onboarding_content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
