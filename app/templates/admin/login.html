{% extends 'base.html' %}
{% block title %}Admin — Vyranos{% endblock %}
{% block body %}
<div class="min-h-screen bg-gray-950 flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <span class="text-2xl font-bold text-white">Local<span class="text-indigo-400">Site</span></span>
      <p class="text-gray-500 text-sm mt-2">Accès administrateur</p>
    </div>

    <div class="bg-gray-900 rounded-2xl border border-gray-800 p-8">
      <form method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1.5">Email</label>
          <input type="email" name="email" required autofocus
            class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1.5">Mot de passe</label>
          <input type="password" name="password" required
            class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg text-sm transition mt-2">
          Connexion
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
