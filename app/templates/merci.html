{% extends 'base.html' %}
{% block title %}Demande reçue — Vyranos{% endblock %}
{% block body %}

<style>
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .icon-in  { animation: scaleIn .5s cubic-bezier(.34,1.56,.64,1) both .1s; }
  .text-in  { animation: fadeUp .5s cubic-bezier(.16,1,.3,1) both .3s; }
  .text-in2 { animation: fadeUp .5s cubic-bezier(.16,1,.3,1) both .45s; }
  .text-in3 { animation: fadeUp .5s cubic-bezier(.16,1,.3,1) both .6s; }

  .gradient-text {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradShift 4s ease infinite;
  }
  @keyframes gradShift {
    0%,100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
</style>

<div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center px-6 text-center">

  <a href="/" class="text-lg font-bold tracking-tight mb-16">Vyr<span class="gradient-text">anos</span></a>

  <div class="icon-in w-20 h-20 rounded-2xl bg-green-50 border border-green-100 flex items-center justify-center text-4xl mb-8 shadow-sm">
    ✅
  </div>

  <h1 class="text-in text-3xl font-bold text-gray-900 mb-3">Votre demande est bien reçue !</h1>
  <p class="text-in2 text-gray-500 max-w-sm mb-10 leading-relaxed">
    Je vous recontacte dans les <strong class="text-gray-700">24 heures</strong> pour discuter de votre projet et vous préparer une proposition personnalisée.
  </p>

  <div class="text-in3 flex flex-col sm:flex-row gap-3">
    <a href="/"
      class="inline-flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-100">
      Retour à l'accueil
    </a>
  </div>

</div>
{% endblock %}
